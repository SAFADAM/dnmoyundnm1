  <!-- Microphone Center Element -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" stroke="#000000" stroke-width="6" />
  <rect x="246" y="278" width="20" height="38" rx="8" fill="#f43f5e" stroke="#000000" stroke-width="4" />

  <!-- Sparkles -->
